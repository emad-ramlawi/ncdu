name: Verify and release portable ncdu

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify upstream downloads and package
        run: ./scripts/package.sh
      - name: Test host and static linking
        run: python3 scripts/smoke-test.py dist/ncdu-linux-amd64
      - name: Test Rocky Linux 10
        run: python3 scripts/smoke-test.py dist/ncdu-linux-amd64 --image rockylinux/rockylinux:10
      - name: Test Red Hat UBI 10
        run: python3 scripts/smoke-test.py dist/ncdu-linux-amd64 --image registry.access.redhat.com/ubi10/ubi-minimal:latest
      - uses: actions/upload-artifact@v4
        with:
          name: ncdu-linux-amd64
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ncdu-linux-amd64
          path: dist
      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --verify-tag \
            --title "Portable ncdu $RELEASE_TAG (Linux amd64)" \
            --notes-file .github/release-notes.md
